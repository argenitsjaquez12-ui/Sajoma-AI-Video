<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Sajoma AI Video</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#09090b;
  color:white;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

header{
  padding:22px 18px 12px;
  text-align:center;
}

.logo{
  font-size:28px;
  font-weight:800;
}

.logo span{
  color:#8b5cf6;
}

.subtitle{
  color:#a1a1aa;
  margin-top:5px;
  font-size:14px;
}

.card{
  margin:14px;
  padding:18px;
  background:#18181b;
  border:1px solid #27272a;
  border-radius:20px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tab{
  flex:1;
  padding:12px;
  border:0;
  border-radius:12px;
  background:#27272a;
  color:white;
  font-weight:600;
}

.tab.active{
  background:#7c3aed;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#d4d4d8;
  font-size:14px;
}

textarea,
select{
  width:100%;
  background:#09090b;
  color:white;
  border:1px solid #3f3f46;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.generate{
  width:100%;
  margin-top:18px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#7c3aed;
  color:white;
  font-size:17px;
  font-weight:800;
}

.generate:disabled{
  opacity:.5;
}

.status{
  margin-top:14px;
  text-align:center;
  color:#a1a1aa;
  min-height:24px;
}

.previewTitle{
  font-size:18px;
  font-weight:700;
  margin-bottom:12px;
}

video{
  width:100%;
  display:block;
  border-radius:15px;
  background:black;
}

.historyItem{
  padding:12px;
  border-bottom:1px solid #27272a;
  color:#d4d4d8;
  font-size:14px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111113;
  border-top:1px solid #27272a;
  padding:12px;
  text-align:center;
  z-index:20;
}

.bottom span{
  color:#a1a1aa;
  font-size:12px;
}

.hidden{
  display:none;
}

.photoBox{
  border:1px dashed #52525b;
  padding:25px;
  text-align:center;
  border-radius:15px;
  color:#a1a1aa;
}

.error{
  color:#f87171;
}

.success{
  color:#4ade80;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">Sajoma <span>AI Video</span></div>
  <div class="subtitle">Crea videos con inteligencia artificial</div>
</header>

<div class="card">

  <div class="tabs">
    <button id="textTab" class="tab active">Texto → Video</button>
    <button id="photoTab" class="tab">Foto → Video</button>
  </div>

  <div id="textPanel">

    <label>Describe tu video</label>

    <textarea
      id="prompt"
      placeholder="Ejemplo: Una mujer caminando por Santo Domingo al atardecer, estilo cinematográfico, movimiento de cámara suave..."
    ></textarea>

    <div class="grid">

      <div>
        <label>Duración</label>
        <select id="duration">
          <option value="4">4 segundos</option>
          <option value="6">6 segundos</option>
          <option value="8">8 segundos</option>
        </select>
      </div>

      <div>
        <label>Formato</label>
        <select id="format">
          <option value="9:16">Vertical 9:16</option>
          <option value="16:9">Horizontal 16:9</option>
        </select>
      </div>

    </div>

    <label>Estilo</label>

    <select id="style">
      <option>Cinematográfico</option>
      <option>Realista</option>
      <option>Romántico</option>
      <option>Musical</option>
      <option>Urbano</option>
      <option>Animación</option>
    </select>

    <div class="grid">

      <div>
        <label>Voz</label>
        <select id="voice">
          <option>Sin voz</option>
          <option>Español</option>
        </select>
      </div>

      <div>
        <label>Música</label>
        <select id="music">
          <option>Sin música</option>
          <option>Bachata</option>
          <option>Romántica</option>
          <option>Urbana</option>
        </select>
      </div>

    </div>

    <button id="generate" class="generate">
      🎬 Generar video con IA
    </button>

  </div>

  <div id="photoPanel" class="hidden">

    <label>Foto</label>

    <div class="photoBox">
      <input id="photo" type="file" accept="image/*">
      <p>Selecciona una foto para animarla.</p>
    </div>

    <button
      class="generate"
      onclick="alert('La función Foto → Video se conectará después del generador principal.')"
    >
      🎬 Animar foto
    </button>

  </div>

</div>

<div class="card">

  <div id="previewTitle" class="previewTitle">
    Vista previa
  </div>

  <div id="preview">
    <div style="color:#71717a;text-align:center;padding:30px">
      Tu video aparecerá aquí.
    </div>
  </div>

</div>

<div class="card">

  <div class="previewTitle">Mis videos</div>

  <div id="history">
    <div style="color:#71717a">
      Todavía no tienes videos guardados.
    </div>
  </div>

</div>

</div>

<div class="bottom">
  <span>Sajoma AI Video • Generación con inteligencia artificial</span>
</div>

<script type="module">

const GRADIO_URL =
"https://4b3c748acf8b8934f7.gradio.live";

let Client;

const textTab =
document.getElementById("textTab");

const photoTab =
document.getElementById("photoTab");

const textPanel =
document.getElementById("textPanel");

const photoPanel =
document.getElementById("photoPanel");

const generate =
document.getElementById("generate");

const prompt =
document.getElementById("prompt");

const statusBox =
document.getElementById("status");

const preview =
document.getElementById("preview");

const previewTitle =
document.getElementById("previewTitle");

const history =
document.getElementById("history");


/* =========================
   TABS
========================= */

textTab.onclick = () => {

  textTab.classList.add("active");
  photoTab.classList.remove("active");

  textPanel.classList.remove("hidden");
  photoPanel.classList.add("hidden");

};

photoTab.onclick = () => {

  photoTab.classList.add("active");
  textTab.classList.remove("active");

  photoPanel.classList.remove("hidden");
  textPanel.classList.add("hidden");

};


/* =========================
   STATUS
========================= */

function mostrarEstado(text, clase="") {

  let box = document.getElementById("statusBox");

  if(!box){

    box = document.createElement("div");

    box.id = "statusBox";

    box.className = "status";

    generate.parentNode.appendChild(box);

  }

  box.className = "status " + clase;

  box.textContent = text;

}


/* =========================
   BUSCAR URL
========================= */

function buscarURL(obj){

  if(!obj) return null;

  if(typeof obj === "string"){

    if(
      obj.startsWith("http://") ||
      obj.startsWith("https://") ||
      obj.startsWith("blob:")
    ){

      return obj;

    }

    return null;
  }

  if(Array.isArray(obj)){

    for(const item of obj){

      const found = buscarURL(item);

      if(found) return found;

    }

    return null;

  }

  if(typeof obj === "object"){

    const posibles = [
      obj.url,
      obj.video,
      obj.path,
      obj.data,
      obj.value
    ];

    for(const item of posibles){

      const found = buscarURL(item);

      if(found) return found;

    }

    for(const key of Object.keys(obj)){

      const found = buscarURL(obj[key]);

      if(found) return found;

    }

  }

  return null;

}


/* =========================
   GUARDAR HISTORIAL
========================= */

function guardarVideo(url, texto){

  let videos =
    JSON.parse(
      localStorage.getItem("sajoma_videos") || "[]"
    );

  videos.unshift({
    url:url,
    texto:texto,
    fecha:new Date().toLocaleString()
  });

  videos =
    videos.slice(0,10);

  localStorage.setItem(
    "sajoma_videos",
    JSON.stringify(videos)
  );

  mostrarHistorial();

}


function mostrarHistorial(){

  const videos =
    JSON.parse(
      localStorage.getItem("sajoma_videos") || "[]"
    );

  if(!videos.length){

    history.innerHTML =
      `<div style="color:#71717a">
        Todavía no tienes videos guardados.
      </div>`;

    return;

  }

  history.innerHTML =
    videos.map((v,i)=>`

      <div class="historyItem">

        <div>
          🎬 ${escapeHTML(v.texto)}
        </div>

        <div style="color:#71717a;margin-top:4px">
          ${v.fecha}
        </div>

        <button
          onclick="verVideo(${i})"
          style="
            margin-top:8px;
            padding:8px 12px;
            border:0;
            border-radius:8px;
            background:#27272a;
            color:white;
          "
        >
          Ver
        </button>

      </div>

    `).join("");

}


function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


window.verVideo = function(index){

  const videos =
    JSON.parse(
      localStorage.getItem("sajoma_videos") || "[]"
    );

  const v = videos[index];

  if(!v) return;

  mostrarVideo(v.url,v.texto);

};


/* =========================
   MOSTRAR VIDEO
========================= */

function mostrarVideo(url,texto){

  previewTitle.textContent =
    "Tu video está listo";

  preview.innerHTML = "";

  const video =
    document.createElement("video");

  video.controls = true;

  video.playsInline = true;

  video.preload = "metadata";

  video.src = url;

  video.setAttribute(
    "crossorigin",
    "anonymous"
  );

  video.onerror = () => {

    preview.innerHTML = `
      <div class="error"
           style="text-align:center;padding:25px">

        El video fue generado,
        pero el enlace de reproducción
        ya no está disponible.

      </div>
    `;

  };

  preview.appendChild(video);

  video.load();

}


/* =========================
   GENERAR
========================= */

generate.onclick =
async function(){

  const idea =
    prompt.value.trim();

  if(!idea){

    mostrarEstado(
      "❌ Escribe primero una descripción.",
      "error"
    );

    prompt.focus();

    return;

  }

  generate.disabled = true;

  previewTitle.textContent =
    "Generando video...";

  preview.innerHTML = `
    <div style="
      text-align:center;
      padding:35px;
      color:#a1a1aa;
    ">
      <div style="font-size:35px">
        🎬
      </div>

      <div style="margin-top:10px">
        La inteligencia artificial está
        creando tu video...
      </div>

      <div style="
        margin-top:8px;
        font-size:13px;
        color:#71717a;
      ">
        Puede tardar varios minutos.
      </div>
    </div>
  `;

  mostrarEstado(
    "⏳ Conectando con Sajoma AI..."
  );

  try{

    if(!Client){

      const module =
        await import(
          "https://cdn.jsdelivr.net/npm/@gradio/client@1.0.0/dist/index.min.js"
        );

      Client =
        module.Client;

    }

    mostrarEstado(
      "⏳ Conectando con el generador..."
    );

    const app =
      await Client.connect(
        GRADIO_URL
      );

    mostrarEstado(
      "⏳ Enviando tu video..."
    );

    const resultado =
      await app.predict(
        "/predict",
        [idea]
      );

    console.log(
      "RESULTADO GRADIO:",
      resultado
    );

    const url =
      buscarURL(resultado);

    if(!url){

      console.error(
        "No se encontró URL:",
        resultado
      );

      throw new Error(
        "El generador terminó pero no devolvió el video."
      );

    }

    mostrarEstado(
      "✅ Video generado.",
      "success"
    );

    mostrarVideo(
      url,
      idea
    );

    guardarVideo(
      url,
      idea
    );

  }catch(error){

    console.error(
      "ERROR SAJOMA:",
      error
    );

    previewTitle.textContent =
      "No se pudo generar";

    preview.innerHTML = `
      <div class="error"
           style="
             text-align:center;
             padding:30px;
           ">

        ❌ No se pudo generar el video.

        <div style="
          margin-top:10px;
          font-size:13px;
          color:#a1a1aa;
        ">
          ${escapeHTML(
            error?.message ||
            "Error de conexión con el generador."
          )}
        </div>

      </div>
    `;

    mostrarEstado(
      "❌ Error de conexión.",
      "error"
    );

  }finally{

    generate.disabled = false;

  }

};


/* =========================
   HISTORIAL
========================= */

mostrarHistorial();

</script>

</body>
</html>
