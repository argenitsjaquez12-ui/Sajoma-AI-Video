<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sajoma AI Video</title>

  <script type="module">
    import { Client } from
      "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

    window.SajomaGradioClient = Client;
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .85;
    }

    .container {
      width: min(900px, 94%);
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 22px rgba(0,0,0,.08);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      background: #e5e7eb;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #111827;
      color: white;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
      font-size: 17px;
    }

    textarea,
    select,
    input[type="file"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 13px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .generate {
      width: 100%;
      margin-top: 24px;
      padding: 17px;
      border: 0;
      border-radius: 15px;
      background: #111827;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 13px;
      background: #f3f4f6;
      text-align: center;
      font-weight: bold;
      word-break: break-word;
    }

    .preview {
      text-align: center;
    }

    .preview h2 {
      margin-top: 0;
    }

    video {
      width: 100%;
      max-height: 650px;
      border-radius: 16px;
      background: black;
      display: none;
    }

    .download {
      display: none;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 13px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .photo-box {
      display: none;
    }

    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍓 Sajoma AI Video</h1>
  <p>Genera videos reales con inteligencia artificial</p>
</header>

<div class="container">

  <!-- ======================================================
       CREADOR
       ====================================================== -->

  <div class="card">

    <div class="tabs">

      <button
        id="textTab"
        class="tab active"
        type="button">
        ✍️ Texto → Video
      </button>

      <button
        id="photoTab"
        class="tab"
        type="button">
        🖼️ Foto → Video
      </button>

    </div>


    <!-- TEXTO -->

    <div id="textPanel">

      <label for="idea">
        🍓 Escribe tu historia
      </label>

      <textarea
        id="idea"
        placeholder="Ejemplo: La pequeña fresa quería conocer el mundo. Un día salió de su jardín y comenzó una aventura llena de sorpresas."
      ></textarea>

    </div>


    <!-- FOTO -->

    <div id="photoPanel" class="photo-box">

      <label for="photo">
        🖼️ Selecciona una foto
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*"
      >

      <p>
        La función Foto → Video requiere conectar
        un modelo de imagen a video.
      </p>

    </div>


    <!-- OPCIONES -->

    <div class="grid">

      <div>

        <label for="duration">
          ⏱️ Duración
        </label>

        <select id="duration">

          <option value="4 segundos">
            4 segundos
          </option>

          <option value="6 segundos">
            6 segundos
          </option>

          <option value="8 segundos">
            8 segundos
          </option>

        </select>

      </div>


      <div>

        <label for="format">
          📱 Formato
        </label>

        <select id="format">

          <option value="Vertical 9:16">
            Vertical 9:16
          </option>

          <option value="Horizontal 16:9">
            Horizontal 16:9
          </option>

        </select>

      </div>


      <div>

        <label for="style">
          🎨 Estilo
        </label>

        <select id="style">

          <option value="Cinematográfico">
            Cinematográfico
          </option>

          <option value="Realista">
            Realista
          </option>

          <option value="Animado">
            Animado
          </option>

          <option value="Infantil">
            Infantil
          </option>

          <option value="Cuento mágico">
            Cuento mágico
          </option>

          <option value="Documental">
            Documental
          </option>

          <option value="Urbano">
            Urbano
          </option>

          <option value="Romántico">
            Romántico
          </option>

        </select>

      </div>


      <div>

        <label for="voice">
          🎙️ Narración
        </label>

        <select id="voice">

          <option value="Español">
            Español
          </option>

          <option value="Sin voz">
            Sin voz
          </option>

        </select>

      </div>


      <div>

        <label for="music">
          🎵 Música
        </label>

        <select id="music">

          <option value="Sin música">
            Sin música
          </option>

          <option value="Música suave">
            Música suave
          </option>

          <option value="Bachata">
            Bachata
          </option>

          <option value="Música infantil">
            Música infantil
          </option>

        </select>

      </div>

    </div>


    <!-- BOTÓN -->

    <button
      id="generateBtn"
      class="generate"
      type="button">

      🎬 GENERAR VIDEO

    </button>


    <!-- ESTADO -->

    <div
      id="status"
      class="status">

      Listo para generar

    </div>

  </div>


  <!-- ======================================================
       PREVISUALIZACIÓN
       ====================================================== -->

  <div class="card preview">

    <h2 id="previewTitle">
      🎬 Vista previa
    </h2>

    <p id="previewText">
      Tu video aparecerá aquí.
    </p>

    <video
      id="video"
      controls
      playsinline>
    </video>

    <br>

    <a
      id="download"
      class="download"
      href="#"
      download="sajoma-ai-video.mp4">

      ⬇️ Descargar video

    </a>

  </div>


  <!-- ======================================================
       HISTORIAL
       ====================================================== -->

  <div class="card">

    <h2>
      📁 Mis videos
    </h2>

    <div id="history">
      Todavía no tienes videos guardados.
    </div>

  </div>

</div>


<script>

  // ========================================================
  // SERVIDOR KAGGLE
  // ========================================================

  const GRADIO_URL =
    "https://61d253cf93f421ab13.gradio.live";


  // ========================================================
  // ELEMENTOS
  // ========================================================

  const idea =
    document.getElementById("idea");

  const duration =
    document.getElementById("duration");

  const format =
    document.getElementById("format");

  const style =
    document.getElementById("style");

  const voice =
    document.getElementById("voice");

  const music =
    document.getElementById("music");

  const generateBtn =
    document.getElementById("generateBtn");

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  const download =
    document.getElementById("download");

  const previewTitle =
    document.getElementById("previewTitle");

  const previewText =
    document.getElementById("previewText");

  const history =
    document.getElementById("history");

  const textTab =
    document.getElementById("textTab");

  const photoTab =
    document.getElementById("photoTab");

  const textPanel =
    document.getElementById("textPanel");

  const photoPanel =
    document.getElementById("photoPanel");


  // ========================================================
  // PESTAÑA TEXTO
  // ========================================================

  textTab.addEventListener(
    "click",
    () => {

      textTab.classList.add("active");

      photoTab.classList.remove("active");

      textPanel.classList.remove("hidden");

      photoPanel.classList.add("hidden");

    }
  );


  // ========================================================
  // PESTAÑA FOTO
  // ========================================================

  photoTab.addEventListener(
    "click",
    () => {

      photoTab.classList.add("active");

      textTab.classList.remove("active");

      textPanel.classList.add("hidden");

      photoPanel.classList.remove("hidden");

    }
  );


  // ========================================================
  // HISTORIAL
  // ========================================================

  function cargarHistorial() {

    const datos =
      JSON.parse(
        localStorage.getItem(
          "sajomaVideos"
        ) || "[]"
      );

    if (!datos.length) {

      history.textContent =
        "Todavía no tienes videos guardados.";

      return;
    }

    history.innerHTML = "";

    datos.forEach(
      (item) => {

        const div =
          document.createElement("div");

        div.className =
          "history-item";

        div.textContent =
          "🎬 " + item;

        history.appendChild(div);

      }
    );
  }


  function guardarHistorial(texto) {

    const datos =
      JSON.parse(
        localStorage.getItem(
          "sajomaVideos"
        ) || "[]"
      );

    datos.unshift(texto);

    localStorage.setItem(
      "sajomaVideos",
      JSON.stringify(
        datos.slice(0, 20)
      )
    );

    cargarHistorial();
  }


  cargarHistorial();


  // ========================================================
  // ENCONTRAR URL DEL VIDEO
  // ========================================================

  function buscarUrl(objeto) {

    if (!objeto) {
      return null;
    }


    if (typeof objeto === "string") {

      if (
        objeto.startsWith("http://") ||
        objeto.startsWith("https://")
      ) {
        return objeto;
      }

      return null;
    }


    if (Array.isArray(objeto)) {

      for (
        const elemento of objeto
      ) {

        const encontrada =
          buscarUrl(elemento);

        if (encontrada) {
          return encontrada;
        }

      }

      return null;
    }


    if (
      typeof objeto === "object"
    ) {

      const claves = [
        "url",
        "path",
        "video",
        "media_url"
      ];


      for (
        const clave of claves
      ) {

        if (objeto[clave]) {

          const encontrada =
            buscarUrl(
              objeto[clave]
            );

          if (encontrada) {
            return encontrada;
          }

        }

      }


      for (
        const clave in objeto
      ) {

        const encontrada =
          buscarUrl(
            objeto[clave]
          );

        if (encontrada) {
          return encontrada;
        }

      }

    }

    return null;
  }


  // ========================================================
  // GENERAR VIDEO
  // ========================================================

  generateBtn.addEventListener(
    "click",
    async () => {

      const texto =
        idea.value.trim();


      if (!texto) {

        status.textContent =
          "⚠️ Escribe una historia primero.";

        return;
      }


      generateBtn.disabled = true;


      status.textContent =
        "🔌 Conectando con Sajoma AI...";


      previewTitle.textContent =
        "🎬 Generando video...";


      previewText.textContent =
        "La inteligencia artificial está creando tu video.";


      video.pause();

      video.removeAttribute("src");

      video.load();

      video.style.display =
        "none";


      download.style.display =
        "none";


      try {

        const Client =
          window.SajomaGradioClient;


        if (!Client) {

          throw new Error(
            "No se pudo cargar el cliente de Sajoma AI."
          );

        }


        // --------------------------------------------------
        // CONECTAR
        // --------------------------------------------------

        status.textContent =
          "🔌 Conectando al servidor...";


        const app =
          await Client.connect(
            GRADIO_URL
          );


        // --------------------------------------------------
        // GENERAR
        // --------------------------------------------------

        status.textContent =
          "🎥 Generando video con inteligencia artificial...";


        const resultado =
          await app.predict(
            "/generar_video",
            [
              texto,
              duration.value,
              format.value,
              style.value,
              voice.value,
              music.value
            ]
          );


        console.log(
          "Respuesta Sajoma AI:",
          resultado
        );


        // --------------------------------------------------
        // BUSCAR VIDEO
        // --------------------------------------------------

        const videoUrl =
          buscarUrl(resultado);


        if (!videoUrl) {

          throw new Error(
            "El servidor no devolvió el archivo de video."
          );

        }


        // --------------------------------------------------
        // MOSTRAR VIDEO
        // --------------------------------------------------

        video.src =
          videoUrl;

        video.style.display =
          "block";


        download.href =
          videoUrl;

        download.style.display =
          "inline-block";


        previewTitle.textContent =
          "✅ Video generado correctamente";


        previewText.textContent =
          "Tu video está listo.";


        status.textContent =
          "✅ Video generado correctamente.";


        guardarHistorial(
          texto
        );


      } catch (error) {

        console.error(
          "ERROR SAJOMA:",
          error
        );


        status.textContent =
          "❌ Error: " +
          (
            error.message ||
            "Error desconocido"
          );


        previewTitle.textContent =
          "❌ No se pudo generar";


        previewText.textContent =
          "Revisa el mensaje de error mostrado arriba.";


        video.style.display =
          "none";


        download.style.display =
          "none";


      } finally {

        generateBtn.disabled =
          false;

      }

    }
  );

</script>

</body>
</html>
