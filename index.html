<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sajoma AI Video</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#09090b;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.app{
max-width:700px;
margin:auto;
padding-bottom:80px
}

header{
text-align:center;
padding:25px 15px
}

.logo{
font-size:28px;
font-weight:800
}

.logo span{
color:#8b5cf6
}

.sub{
color:#a1a1aa;
font-size:14px;
margin-top:5px
}

.card{
margin:14px;
padding:18px;
border-radius:20px;
background:#18181b;
border:1px solid #27272a
}

.tabs{
display:flex;
gap:8px;
margin-bottom:18px
}

.tab{
flex:1;
padding:13px;
border:0;
border-radius:12px;
background:#27272a;
color:white;
font-weight:700
}

.tab.active{
background:#7c3aed
}

label{
display:block;
margin:14px 0 7px;
color:#d4d4d8;
font-size:14px
}

textarea,select{
width:100%;
background:#09090b;
color:white;
border:1px solid #3f3f46;
border-radius:12px;
padding:13px;
font-size:16px
}

textarea{
height:130px;
resize:vertical
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.generate{
width:100%;
margin-top:18px;
padding:17px;
border:0;
border-radius:15px;
background:#7c3aed;
color:white;
font-size:17px;
font-weight:800
}

.generate:disabled{
opacity:.5
}

.status{
text-align:center;
padding:15px 5px;
font-size:15px
}

.ok{
color:#4ade80
}

.err{
color:#f87171
}

.previewTitle{
font-size:19px;
font-weight:800;
margin-bottom:14px
}

video{
width:100%;
border-radius:15px;
background:#000;
display:block
}

.placeholder{
text-align:center;
padding:35px 10px;
color:#71717a
}

.hidden{
display:none
}

.historyItem{
padding:12px 0;
border-bottom:1px solid #27272a
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111113;
border-top:1px solid #27272a;
padding:12px;
text-align:center;
color:#a1a1aa;
font-size:12px
}
</style>

<!-- CONEXIÓN DIRECTA CON GRADIO -->
<script type="module">

import { Client }
from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

window.SajomaGradioClient = Client;

</script>

</head>

<body>

<div class="app">

<header>

<div class="logo">
Sajoma <span>AI Video</span>
</div>

<div class="sub">
Crea videos con inteligencia artificial
</div>

</header>


<div class="card">

<div class="tabs">

<button id="textTab" class="tab active">
Texto → Video
</button>

<button id="photoTab" class="tab">
Foto → Video
</button>

</div>


<div id="textPanel">

<label>Describe tu video</label>

<textarea
id="prompt"
placeholder="Ejemplo: Una mujer caminando por Santo Domingo al atardecer, estilo cinematográfico..."
></textarea>


<div class="grid">

<div>

<label>Duración</label>

<select id="duration">

<option value="4">
4 segundos
</option>

<option value="6">
6 segundos
</option>

<option value="8">
8 segundos
</option>

</select>

</div>


<div>

<label>Formato</label>

<select id="format">

<option value="9:16">
Vertical 9:16
</option>

<option value="16:9">
Horizontal 16:9
</option>

</select>

</div>

</div>


<label>Estilo</label>

<select id="style">

<option>Cinematográfico</option>
<option>Realista</option>
<option>Romántico</option>
<option>Musical</option>
<option>Urbano</option>
<option>Animación</option>

</select>


<div class="grid">

<div>

<label>Voz</label>

<select id="voice">

<option>Sin voz</option>
<option>Español</option>

</select>

</div>


<div>

<label>Música</label>

<select id="music">

<option>Sin música</option>
<option>Bachata</option>
<option>Romántica</option>
<option>Urbana</option>

</select>

</div>

</div>


<button id="generate" class="generate">
🎬 Generar video con IA
</button>

<div id="status" class="status">
Listo para generar.
</div>

</div>


<div id="photoPanel" class="hidden">

<label>Selecciona una foto</label>

<input
id="photo"
type="file"
accept="image/*"
style="width:100%"
>

<div class="placeholder">
La animación de fotos se conectará después.
</div>

</div>

</div>


<div class="card">

<div id="previewTitle" class="previewTitle">
Vista previa
</div>

<div id="preview">

<div class="placeholder">
Tu video aparecerá aquí.
</div>

</div>

</div>


<div class="card">

<div class="previewTitle">
Mis videos
</div>

<div id="history">

<div class="placeholder">
Todavía no tienes videos guardados.
</div>

</div>

</div>

</div>


<div class="bottom">
Sajoma AI Video • Generación con inteligencia artificial
</div>


<script>

const GRADIO_URL =
"https://36c045529e3bb4f06.gradio.live"; 


const prompt =
document.getElementById("prompt");

const generate =
document.getElementById("generate");

const status =
document.getElementById("status");

const preview =
document.getElementById("preview");

const previewTitle =
document.getElementById("previewTitle");

const history =
document.getElementById("history");


/* TABS */

document.getElementById("textTab").onclick=function(){

document.getElementById("textTab")
.classList.add("active");

document.getElementById("photoTab")
.classList.remove("active");

document.getElementById("textPanel")
.classList.remove("hidden");

document.getElementById("photoPanel")
.classList.add("hidden");

};


document.getElementById("photoTab").onclick=function(){

document.getElementById("photoTab")
.classList.add("active");

document.getElementById("textTab")
.classList.remove("active");

document.getElementById("photoPanel")
.classList.remove("hidden");

document.getElementById("textPanel")
.classList.add("hidden");

};


/* ESCAPAR TEXTO */

function esc(t){

return String(t)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* BUSCAR VIDEO */

function buscarVideo(obj){

if(!obj)return null;

if(typeof obj==="string"){

if(
obj.startsWith("http://") ||
obj.startsWith("https://")
)return obj;

return null;

}

if(Array.isArray(obj)){

for(const x of obj){

const r=buscarVideo(x);

if(r)return r;

}

return null;

}

if(typeof obj==="object"){

const claves=[
"url",
"path",
"video",
"media_url",
"data",
"value"
];

for(const k of claves){

if(obj[k]){

const r=buscarVideo(obj[k]);

if(r)return r;

}

}

for(const k of Object.keys(obj)){

const r=buscarVideo(obj[k]);

if(r)return r;

}

}

return null;

}


/* HISTORIAL */

function cargarHistorial(){

const lista=
JSON.parse(
localStorage.getItem("sajoma_videos")||"[]"
);

if(!lista.length){

history.innerHTML=
'<div class="placeholder">Todavía no tienes videos guardados.</div>';

return;

}

history.innerHTML="";

lista.forEach((v,i)=>{

const div=document.createElement("div");

div.className="historyItem";

div.innerHTML=`

<div>
🎬 ${esc(v.texto)}
</div>

<div style="color:#71717a;margin-top:5px">
${esc(v.fecha)}
</div>

<button
style="
margin-top:8px;
padding:8px 12px;
border:0;
border-radius:8px;
background:#27272a;
color:white
"
onclick="abrirHistorial(${i})"
>
Ver video
</button>

`;

history.appendChild(div);

});

}


window.abrirHistorial=function(i){

const lista=
JSON.parse(
localStorage.getItem("sajoma_videos")||"[]"
);

if(lista[i]){

mostrarVideo(
lista[i].url,
lista[i].texto
);

}

};


/* MOSTRAR VIDEO */

function mostrarVideo(url,texto){

previewTitle.textContent=
"Tu video está listo";

preview.innerHTML="";

const video=
document.createElement("video");

video.controls=true;
video.playsInline=true;
video.preload="metadata";

video.src=url;

preview.appendChild(video);

video.load();

}


/* GENERAR */

generate.onclick=async function(){

const idea=
prompt.value.trim();

if(!idea){

status.textContent=
"❌ Escribe una descripción.";

status.className="status err";

return;

}


generate.disabled=true;

previewTitle.textContent=
"Generando video...";

preview.innerHTML=`

<div class="placeholder">

🎬

<br><br>

La inteligencia artificial está creando tu video.

<br>

Puede tardar varios minutos.

</div>

`;

status.textContent=
"⏳ Cargando generador...";

status.className="status";


try{

/* ESPERAR CLIENTE */

let intentos=0;

while(!window.SajomaGradioClient){

await new Promise(
r=>setTimeout(r,500)
);

intentos++;

if(intentos>30){

throw new Error(
"No se pudo cargar el cliente de Gradio."
);

}

}


const Client=
window.SajomaGradioClient;


/* CONECTAR */

status.textContent=
"⏳ Conectando con Kaggle...";


const app=
await Client.connect(
GRADIO_URL
);


/* GENERAR */

status.textContent=
"⏳ Generando video con IA...";


const resultado=
await app.predict(
"/predict",
[idea]
);


console.log(
"RESULTADO:",
resultado
);


const url=
buscarVideo(resultado);


if(!url){

throw new Error(
"El generador no devolvió el archivo de video."
);

}


mostrarVideo(
url,
idea
);


/* GUARDAR */

const lista=
JSON.parse(
localStorage.getItem("sajoma_videos")||"[]"
);

lista.unshift({

url:url,

texto:idea,

fecha:new Date().toLocaleString()

});

localStorage.setItem(
"sajoma_videos",
JSON.stringify(
lista.slice(0,10)
)
);

cargarHistorial();


status.textContent=
"✅ Video generado correctamente.";

status.className=
"status ok";


}catch(error){

console.error(
"SAJOMA ERROR:",
error
);

previewTitle.textContent=
"No se pudo generar";


preview.innerHTML=`

<div class="placeholder err">

❌ No se pudo generar el video.

<br><br>

${esc(
error.message ||
"Error de conexión."
)}

</div>

`;


status.textContent=
"❌ Error de conexión.";

status.className=
"status err";


}finally{

generate.disabled=false;

}

};


cargarHistorial();

</script>

</body>
</html>
